name: PR Build
on: [pull_request]
jobs:
  # Build
  Build:
    name: Build
    runs-on: windows-2025
    steps:
      - name: Get the sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch all tags and branches
        run: git fetch --prune --unshallow
      - name: Install .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          # .NET 5 required for GitVersion
          dotnet-version: |
            5.x
            8.x
            9.x
            10.x
      - name: Build
        run: .\build.ps1
        shell: powershell
      - name: Publish NuGet package as build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: NuGet Package
          path: ./BuildArtifacts/Packages/NuGet/
  # Integration Tests Script Runner Windows 2019 (.NET 10)
  Test_Windows_DotNetTool:
    name: Integration Tests Script Runner Windows (.NET tool)
    needs: Build
    runs-on: windows-2025
    steps:
      - name: Get the sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install required tools
        run: npm install -g markdownlint-cli@0.45.0
        shell: powershell
      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: NuGet Package
          path: ./BuildArtifacts/Packages/NuGet
      - name: Install .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            10.x
      - name: Run integration tests
        run: ./build.ps1 --verbosity=diagnostic
        working-directory: ./tests/script-runner/net10.0-git-cli/
        shell: powershell
      - name: Publish generated reports as build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Integration Tests Script Runner Windows (.NET tool)
          path: ./tests/script-runner/net10.0/BuildArtifacts/output/
