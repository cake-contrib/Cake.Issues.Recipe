name: Build and tests
on: [push, pull_request]
jobs:
  # Build
  Build:
    name: Build
    runs-on: windows-2025
    steps:
      - name: Get the sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Fetch all tags and branches
        run: git fetch --prune --unshallow
      - name: Install .NET
        uses: actions/setup-dotnet@baa11fbfe1d6520db94683bd5c7a3818018e4309 # v5.1.0
        with:
          # .NET 5 required for GitVersion
          dotnet-version: |
            5.x
            8.x
            9.x
            10.x
      - name: Build
        run: .\build.ps1
        shell: powershell
      - name: Publish NuGet package as build artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: NuGet Package
          path: ./BuildArtifacts/Packages/NuGet/
  # Integration Tests Script Runner Windows 2019 (.NET 10)
  Test_Windows_DotNetTool:
    name: Integration Tests Script Runner Windows (.NET tool)
    needs: Build
    runs-on: windows-2025
    steps:
      - name: Get the sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install required tools
        run: npm install -g markdownlint-cli@0.45.0
        shell: powershell
      - name: Download build artifact
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: NuGet Package
          path: ./BuildArtifacts/Packages/NuGet
      - name: Install .NET
        uses: actions/setup-dotnet@baa11fbfe1d6520db94683bd5c7a3818018e4309 # v5.1.0
        with:
          dotnet-version: |
            10.x
      - name: Run integration tests
        run: ./build.ps1 --verbosity=diagnostic
        working-directory: ./tests/script-runner/net10.0-git-cli/
        shell: powershell
      - name: Publish generated reports as build artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: Integration Tests Script Runner Windows (.NET tool)
          path: ./tests/script-runner/net10.0/BuildArtifacts/output/
