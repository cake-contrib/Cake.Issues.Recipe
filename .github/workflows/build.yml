name: Build and tests
on: [push, pull_request]
jobs:
  # Build
  Build:
    name: Build
    runs-on: windows-2025
    steps:
      - name: Get the sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Fetch all tags and branches
        run: git fetch --prune --unshallow
      - name: Install .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          # .NET 5 required for GitVersion
          dotnet-version: |
            5.x
            8.x
            9.x
            10.x
      - name: Build
        run: .\build.ps1
        shell: powershell
      - name: Publish NuGet package as build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NuGet Package
          path: ./BuildArtifacts/Packages/NuGet/
  # Integration Tests Script Runner Windows 2019 (.NET 10)
  Test_Windows_DotNetTool:
    name: Integration Tests Script Runner Windows (.NET tool)
    needs: Build
    runs-on: windows-2025
    steps:
      - name: Get the sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install required tools
        run: npm install -g markdownlint-cli@0.45.0
        shell: powershell
      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: NuGet Package
          path: ./BuildArtifacts/Packages/NuGet
      - name: Install .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: |
            10.x
      - name: Run integration tests
        run: ./build.ps1 --verbosity=diagnostic
        working-directory: ./tests/script-runner/net10.0-git-cli/
        shell: powershell
      - name: Publish generated reports as build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Integration Tests Script Runner Windows (.NET tool)
          path: ./tests/script-runner/net10.0/BuildArtifacts/output/
